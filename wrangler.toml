"$schema" = "./node_modules/wrangler/config-schema.json"
name = "drawdown"
main = "src/worker.js"
compatibility_date = "2026-10-24"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [ "/api/*" ]

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_THINKING = "low"

[[d1_databases]]
binding = "DB"
database_name = "drawdown"
database_id = "00000000-0000-4000-8000-000000000001"
